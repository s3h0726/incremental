<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civilization Incremental</title>

<style>
body{
    background:#101114;
    color:#E4E7EE;
    font-family:Arial;
    margin:0;
}

.topbar{
    display:flex;
    gap:20px;
    padding:15px;
    background:#1A1D24;
    border-bottom:1px solid #303542;
}

.container{
    display:grid;
    grid-template-columns:250px 1fr;
    height:calc(100vh - 60px);
}

.sidebar{
    background:#1A1D24;
    padding:15px;
}

.main{
    padding:20px;
}

.card{
    background:#1A1D24;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
}

button{
    width:100%;
    padding:10px;
    margin-top:8px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.stage{
    font-size:32px;
    margin-bottom:20px;
}
</style>
</head>

<body>

<div class="topbar">
    <div>👥 <span id="population">10</span></div>
    <div>💰 <span id="money">100</span></div>
    <div>🔬 <span id="science">0</span></div>
    <div>🌍 <span id="influence">0</span></div>
    <div>🟢 <span id="prestige">0</span></div>
</div>

<div class="container">

<div class="sidebar">

<div class="card">
<h3>건설</h3>

<button onclick="buyHouse()">
주택 (+10 인구)
<br>
비용: 50
</button>

<button onclick="buyFactory()">
공장 (+20 자금/s)
<br>
비용: 500
</button>

<button onclick="buyLab()">
연구소 (+5 과학/s)
<br>
비용: 1000
</button>

</div>

<div class="card">
<h3>프레스티지</h3>

<button onclick="prestigeReset()">
세계정부 재설정
</button>

</div>

</div>

<div class="main">

<div class="card">
<div class="stage" id="stage">
마을
</div>

<p>다음 단계 필요 인구:</p>
<p id="nextReq">100</p>

<button onclick="advanceStage()">
발전하기
</button>

</div>

<div class="card">
<h3>세계 지도</h3>
🗺️ 지도 기능 구현 예정
</div>

</div>

</div>

<script>

let population = 10;
let money = 100;
let science = 0;
let influence = 0;

let prestige = 0;

const stages = [
"마을",
"소도시",
"도시",
"광역시",
"특별시",
"국가",
"강대국",
"초강대국",
"세계정부"
];

const requirements = [
100,
500,
2000,
10000,
50000,
200000,
1000000,
5000000
];

let stageIndex = 0;

let houses = 0;
let factories = 0;
let labs = 0;

function updateUI(){

document.getElementById("population").innerText =
format(population);

document.getElementById("money").innerText =
format(money);

document.getElementById("science").innerText =
format(science);

document.getElementById("influence").innerText =
format(influence);

document.getElementById("prestige").innerText =
prestige;

document.getElementById("stage").innerText =
stages[stageIndex];

if(stageIndex < requirements.length){
document.getElementById("nextReq").innerText =
format(requirements[stageIndex]);
}else{
document.getElementById("nextReq").innerText =
"최종 단계";
}

}

function buyHouse(){

if(money >= 50){

money -= 50;
houses++;

population += 10 * (1 + prestige);

}

}

function buyFactory(){

if(money >= 500){

money -= 500;
factories++;

}

}

function buyLab(){

if(money >= 1000){

money -= 1000;
labs++;

}

}

function advanceStage(){

if(
stageIndex < requirements.length &&
population >= requirements[stageIndex]
){
stageIndex++;
}

}

function prestigeReset(){

if(stageIndex == 8){

let gain =
Math.floor(Math.sqrt(population / 100000));

if(gain < 1) gain = 1;

prestige += gain;

population = 10;
money = 100;
science = 0;
influence = 0;

houses = 0;
factories = 0;
labs = 0;

stageIndex = 0;

alert("문명 포인트 +" + gain);

}

}

function format(num){

if(num >= 1e12) return (num/1e12).toFixed(2)+"T";
if(num >= 1e9) return (num/1e9).toFixed(2)+"B";
if(num >= 1e6) return (num/1e6).toFixed(2)+"M";
if(num >= 1e3) return (num/1e3).toFixed(2)+"K";

return Math.floor(num);

}

setInterval(()=>{

money += factories * 20 * (1 + prestige);

science += labs * 5 * (1 + prestige);

population += houses * 0.5 * (1 + prestige);

influence += stageIndex * 0.2;

updateUI();

},1000);

updateUI();

</script>

</body>
</html>
